services:
  postgres:
    image: postgres:16-alpine
    container_name: careerbridge-postgres
    environment:
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge
      POSTGRES_DB: careerbridge
    ports:
      - "5432:5432"
    volumes:
      - careerbridge_pg:/var/lib/postgresql/data

volumes:
  careerbridge_pg:
