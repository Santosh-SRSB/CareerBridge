name: Deploy DEV

# DEV only: careerbridge-api-dev / careerbridge-web-dev in careerbridge-f7b72 (asia-south1).
# Runs CI first, then builds both images tagged with the commit SHA, then deploys the API
# (health-checked) before the Web. Only the container image is changed on each service;
# env vars, Secret Manager refs, Cloud SQL, scaling and probes are left as configured.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: careerbridge-f7b72
  GCP_REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev
  IMAGE_REPO: asia-south1-docker.pkg.dev/careerbridge-f7b72/careerbridge-dev
  API_SERVICE: careerbridge-api-dev
  WEB_SERVICE: careerbridge-web-dev

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build + push · ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Check Workload Identity Federation settings
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as variables on the 'dev' GitHub environment (see docs/ci-cd-dev.md)."
            exit 1
          fi

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: ./.github/actions/docker-image
        with:
          image: ${{ matrix.image }}
          tags: ${{ env.IMAGE_REPO }}/${{ matrix.image }}:${{ github.sha }}
          push: 'true'

  deploy-api:
    name: Deploy API · careerbridge-api-dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-south1-docker.pkg.dev/careerbridge-f7b72/careerbridge-dev/api:${{ github.sha }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Record current revision
        run: |
          gcloud run services describe "$API_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(status.latestReadyRevisionName,spec.template.spec.containers[0].image)'

      # `services update` fails if the service does not exist (never creates one) and only
      # shifts traffic once the new revision passes its startup probe. The API entrypoint runs
      # `prisma migrate deploy` before listening, so a failed migration keeps the old revision live.
      - name: Deploy new image
        run: |
          gcloud run services update "$API_SERVICE" --image="$IMAGE" \
            --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet

      - name: Verify rollout and health
        run: |
          set -euo pipefail
          svc=$(gcloud run services describe "$API_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format=json)
          created=$(jq -r '.status.latestCreatedRevisionName' <<<"$svc")
          ready=$(jq -r '.status.latestReadyRevisionName' <<<"$svc")
          image=$(jq -r '.spec.template.spec.containers[0].image' <<<"$svc")
          traffic=$(jq -r --arg r "$ready" '[.status.traffic[] | select(.revisionName == $r) | .percent] | add // 0' <<<"$svc")
          url=$(jq -r '.status.url' <<<"$svc")
          echo "revision=$ready image=$image traffic=${traffic}%"
          [ "$image" = "$IMAGE" ] || { echo "::error::Service image is $image, expected $IMAGE"; exit 1; }
          [ "$created" = "$ready" ] || { echo "::error::Latest revision $created is not ready (ready: $ready)"; exit 1; }
          [ "$traffic" = "100" ] || { echo "::error::Revision $ready serves ${traffic}% of traffic, expected 100%"; exit 1; }
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 \
            -o /tmp/health.json "$url/api/v1/health"
          jq -e '.data.status == "ok"' /tmp/health.json > /dev/null \
            || { echo "::error::Unexpected health response: $(cat /tmp/health.json)"; exit 1; }
          echo "API health OK: $url/api/v1/health"
          {
            echo "### API · $API_SERVICE"
            echo "- revision: \`$ready\`"
            echo "- image: \`$image\`"
            echo "- health: \`$url/api/v1/health\` → ok"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        run: |
          gcloud run revisions list --service="$API_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --limit=5
          latest=$(gcloud run services describe "$API_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(status.latestCreatedRevisionName)')
          gcloud run revisions describe "$latest" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='yaml(status.conditions)'

  deploy-web:
    name: Deploy Web · careerbridge-web-dev
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-south1-docker.pkg.dev/careerbridge-f7b72/careerbridge-dev/web:${{ github.sha }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Record current revision
        run: |
          gcloud run services describe "$WEB_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(status.latestReadyRevisionName,spec.template.spec.containers[0].image)'

      - name: Deploy new image
        run: |
          gcloud run services update "$WEB_SERVICE" --image="$IMAGE" \
            --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet

      - name: Verify rollout and response
        run: |
          set -euo pipefail
          svc=$(gcloud run services describe "$WEB_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format=json)
          created=$(jq -r '.status.latestCreatedRevisionName' <<<"$svc")
          ready=$(jq -r '.status.latestReadyRevisionName' <<<"$svc")
          image=$(jq -r '.spec.template.spec.containers[0].image' <<<"$svc")
          traffic=$(jq -r --arg r "$ready" '[.status.traffic[] | select(.revisionName == $r) | .percent] | add // 0' <<<"$svc")
          url=$(jq -r '.status.url' <<<"$svc")
          echo "revision=$ready image=$image traffic=${traffic}%"
          [ "$image" = "$IMAGE" ] || { echo "::error::Service image is $image, expected $IMAGE"; exit 1; }
          [ "$created" = "$ready" ] || { echo "::error::Latest revision $created is not ready (ready: $ready)"; exit 1; }
          [ "$traffic" = "100" ] || { echo "::error::Revision $ready serves ${traffic}% of traffic, expected 100%"; exit 1; }
          status=$(curl --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 \
            -o /dev/null -w '%{http_code}' "$url/")
          [ "$status" = "200" ] || { echo "::error::Web returned HTTP $status for $url/"; exit 1; }
          echo "Web OK: $url/ → 200"
          {
            echo "### Web · $WEB_SERVICE"
            echo "- revision: \`$ready\`"
            echo "- image: \`$image\`"
            echo "- check: \`$url/\` → 200"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        run: |
          gcloud run revisions list --service="$WEB_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --limit=5
          latest=$(gcloud run services describe "$WEB_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(status.latestCreatedRevisionName)')
          gcloud run revisions describe "$latest" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='yaml(status.conditions)'
