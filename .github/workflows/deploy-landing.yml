name: Deploy landing

on:
  push:
    branches: [feature/live-landing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build -w landing
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/CareerBridge"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
