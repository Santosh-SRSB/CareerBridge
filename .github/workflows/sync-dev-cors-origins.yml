# Fast DEV fix: sync API CORS (WEB_ORIGIN) + PUBLIC_WEB_URL from the env yaml.
# Use when brand domains (.co.in / .in) need OTP/CORS without a full image rebuild.
name: Sync DEV CORS origins

on:
  workflow_dispatch:

concurrency:
  group: sync-dev-cors
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: careerbridge-f7b72
  GCP_REGION: asia-south1
  API_SERVICE: careerbridge-api-dev

jobs:
  sync:
    name: Update WEB_ORIGIN on careerbridge-api-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync WEB_ORIGIN and PUBLIC_WEB_URL
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os, re, subprocess

          text = Path("infrastructure/cloudrun-api-dev.env.yaml").read_text(encoding="utf-8")

          def grab(key: str) -> str:
              m = re.search(rf'^{re.escape(key)}:\s*"(.*)"\s*$', text, re.M)
              if not m:
                  raise SystemExit(f"::error::Could not parse {key}")
              return m.group(1).replace("\r", "").strip()

          web_origin = grab("WEB_ORIGIN").replace(",", ";")
          public_web = grab("PUBLIC_WEB_URL")
          print(f"WEB_ORIGIN_SAFE origins={web_origin.count(';') + 1}")
          print(f"PUBLIC_WEB_URL={public_web}")

          svc = os.environ["API_SERVICE"]
          region = os.environ["GCP_REGION"]
          project = os.environ["GCP_PROJECT_ID"]
          base = [
              "gcloud", "run", "services", "update", svc,
              f"--region={region}", f"--project={project}", "--quiet",
          ]
          subprocess.check_call(base + [f"--update-env-vars=PUBLIC_WEB_URL={public_web}"])
          subprocess.check_call(base + [f"--update-env-vars=WEB_ORIGIN={web_origin}"])
          PY

      - name: Health check
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$API_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(status.url)')
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --max-time 30 \
            -o /tmp/health.json "$url/api/v1/health"
          jq -e '.data.status == "ok"' /tmp/health.json
          {
            echo "### CORS sync"
            echo "- service: \`$API_SERVICE\`"
            echo "- health: ok"
            echo "- WEB_ORIGIN now includes srsbcareerbridge.co.in"
          } >> "$GITHUB_STEP_SUMMARY"
