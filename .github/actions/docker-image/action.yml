name: Build CareerBridge image
description: >
  Builds the API or Web image from infrastructure/docker/Dockerfile.<image>.
  Web build args (public NEXT_PUBLIC_* config) are read from a cloudbuild substitutions
  YAML (default: infrastructure/cloudbuild.web.yaml for DEV) so GitHub Actions and Cloud
  Build bake identical values. PROD may pass web_config + web_api_url_override.

inputs:
  image:
    description: "api or web"
    required: true
  tags:
    description: "Newline-separated image tags"
    required: true
  push:
    description: "Push the image (requires a prior registry login)"
    required: true
  web_config:
    description: "Path to cloudbuild YAML with web NEXT_PUBLIC_* substitutions"
    required: false
    default: infrastructure/cloudbuild.web.yaml
  web_api_url_override:
    description: "If non-empty, overrides _API_URL from the config file (use for PROD)"
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve build args
      id: args
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        WEB_CONFIG: ${{ inputs.web_config }}
        WEB_API_URL_OVERRIDE: ${{ inputs.web_api_url_override }}
      run: |
        set -euo pipefail
        case "$IMAGE" in
          api) echo "build-args=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          web) ;;
          *) echo "::error::Unknown image '$IMAGE' (expected api or web)"; exit 1 ;;
        esac
        f="${WEB_CONFIG:-infrastructure/cloudbuild.web.yaml}"
        if [ ! -f "$f" ]; then
          echo "::error file=$f::web config file not found" >&2
          exit 1
        fi
        get() {
          local v
          v=$(yq -r ".substitutions.$1" "$f")
          if [ -z "$v" ] || [ "$v" = "null" ]; then
            echo "::error file=$f::substitution $1 is missing" >&2
            return 1
          fi
          printf '%s' "$v"
        }
        if [ -n "${WEB_API_URL_OVERRIDE:-}" ]; then
          api_url="$WEB_API_URL_OVERRIDE"
        else
          api_url=$(get _API_URL)
        fi
        if [ -z "$api_url" ] || [ "$api_url" = "null" ] || [ "$api_url" = "REQUIRE_OVERRIDE" ]; then
          echo "::error::NEXT_PUBLIC_API_URL is not configured (set _API_URL in $f or web_api_url_override)" >&2
          exit 1
        fi
        dev_otp=$(get _AUTH_DEV_OTP)
        fb_api_key=$(get _FB_API_KEY)
        fb_auth_domain=$(get _FB_AUTH_DOMAIN)
        fb_project_id=$(get _FB_PROJECT_ID)
        fb_bucket=$(get _FB_STORAGE_BUCKET)
        fb_sender=$(get _FB_MESSAGING_SENDER_ID)
        fb_app_id=$(get _FB_APP_ID)
        fb_measurement=$(get _FB_MEASUREMENT_ID)
        # Optional: empty string OK until Ads conversion labels exist
        google_tag_id=$(yq -r ".substitutions._GOOGLE_TAG_ID // \"\"" "$f")
        google_ads_id=$(yq -r ".substitutions._GOOGLE_ADS_ID // \"\"" "$f")
        ads_label_signup=$(yq -r ".substitutions._GOOGLE_ADS_LABEL_SIGNUP // \"\"" "$f")
        ads_label_employer=$(yq -r ".substitutions._GOOGLE_ADS_LABEL_EMPLOYER_SIGNUP // \"\"" "$f")
        ads_label_lead=$(yq -r ".substitutions._GOOGLE_ADS_LABEL_LEAD // \"\"" "$f")
        ads_label_apply=$(yq -r ".substitutions._GOOGLE_ADS_LABEL_APPLY // \"\"" "$f")
        meta_pixel_id=$(yq -r ".substitutions._META_PIXEL_ID // \"\"" "$f")
        echo "Web NEXT_PUBLIC_API_URL=$api_url"
        echo "Web config file=$f"
        {
          echo 'build-args<<__CB_BUILD_ARGS__'
          echo "NEXT_PUBLIC_API_URL=$api_url"
          echo "NEXT_PUBLIC_AUTH_DEV_OTP=$dev_otp"
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=$fb_api_key"
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$fb_auth_domain"
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$fb_project_id"
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$fb_bucket"
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$fb_sender"
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=$fb_app_id"
          echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$fb_measurement"
          echo "NEXT_PUBLIC_GOOGLE_TAG_ID=$google_tag_id"
          echo "NEXT_PUBLIC_GOOGLE_ADS_ID=$google_ads_id"
          echo "NEXT_PUBLIC_GOOGLE_ADS_LABEL_SIGNUP=$ads_label_signup"
          echo "NEXT_PUBLIC_GOOGLE_ADS_LABEL_EMPLOYER_SIGNUP=$ads_label_employer"
          echo "NEXT_PUBLIC_GOOGLE_ADS_LABEL_LEAD=$ads_label_lead"
          echo "NEXT_PUBLIC_GOOGLE_ADS_LABEL_APPLY=$ads_label_apply"
          echo "NEXT_PUBLIC_META_PIXEL_ID=$meta_pixel_id"
          echo '__CB_BUILD_ARGS__'
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build${{ inputs.push == 'true' && ' and push' || '' }} ${{ inputs.image }} image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: infrastructure/docker/Dockerfile.${{ inputs.image }}
        build-args: ${{ steps.args.outputs.build-args }}
        tags: ${{ inputs.tags }}
        push: ${{ inputs.push }}
        provenance: false
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}
