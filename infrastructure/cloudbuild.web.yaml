# Cloud Build — CareerBridge Web → Artifact Registry (DEV)
# Example:
# gcloud builds submit --config=infrastructure/cloudbuild.web.yaml \
#   --substitutions=_TAG=dev,_API_URL=https://careerbridge-api-dev-601892050765.asia-south1.run.app/api/v1 .
substitutions:
  _REGION: asia-south1
  _REPO: careerbridge-dev
  _IMAGE: web
  _TAG: dev
  _API_URL: https://careerbridge-api-dev-601892050765.asia-south1.run.app/api/v1
  _AUTH_DEV_OTP: "false"
  _FB_API_KEY: AIzaSyBEAdXWyCupaF14a_5j7aNHwxxtEHLnbaU
  _FB_AUTH_DOMAIN: careerbridge-f7b72.firebaseapp.com
  _FB_PROJECT_ID: careerbridge-f7b72
  _FB_STORAGE_BUCKET: careerbridge-f7b72.firebasestorage.app
  _FB_MESSAGING_SENDER_ID: "601892050765"
  _FB_APP_ID: 1:601892050765:web:293fe4ec50962f076e4904
  _FB_MEASUREMENT_ID: G-0EJSP0HMP1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infrastructure/docker/Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_AUTH_DEV_OTP=${_AUTH_DEV_OTP}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FB_MEASUREMENT_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:dev
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:dev

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
